  --bg:#ffffff; --bg2:#fff7f0; --card:#ffffff; --text:#1f1f1f; --muted:#6b6b6b; --line:#f0e3d8;
  --brand:#f26b0f; --brand-d:#d95a05; --soft:#fff1e6; --ok:#16a34a; --onbrand:#ffffff;
  --shadow:0 4px 16px rgba(242,107,15,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141210; --bg2:#1b1815; --card:#201c18; --text:#f3eee9; --muted:#a89c91; --line:#342c25;
    --brand:#ff8a3d; --brand-d:#ff9f5e; --soft:#2c221a; --ok:#3ccf7a; --onbrand:#1a1009;
    --shadow:0 4px 16px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#141210; --bg2:#1b1815; --card:#201c18; --text:#f3eee9; --muted:#a89c91; --line:#342c25;
  --brand:#ff8a3d; --brand-d:#ff9f5e; --soft:#2c221a; --ok:#3ccf7a; --onbrand:#1a1009;
  --shadow:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

header{background:var(--bg2);border-bottom:3px solid var(--brand);padding:18px 0 26px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.by{display:flex;align-items:center;gap:10px;text-decoration:none}
.by .fy-logo{width:48px;height:48px;border-radius:12px;background:transparent;display:grid;place-items:center;overflow:hidden;flex:none}
.by .fy-logo img{width:48px;height:48px;object-fit:contain}
.by small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.by strong{display:block;color:var(--brand);font-size:17px;line-height:1.3}
.toggles{display:flex;gap:8px}
.tbtn{min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--brand);color:var(--brand)}
header h1{margin:18px 0 6px;font-size:clamp(23px,5vw,38px);line-height:1.35}
header h1 span{color:var(--brand)}
header p{margin:0;color:var(--muted);max-width:740px}
.progress{margin-top:16px;background:var(--soft);border-radius:99px;height:12px;overflow:hidden;max-width:520px;border:1px solid var(--line)}
.progress span{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .3s}
.progress-label{font-size:14px;margin-top:6px;color:var(--muted);font-weight:600}

.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;flex-direction:column;gap:10px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:16px}
.search:focus{outline:2px solid var(--brand);border-color:transparent}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap}
.tab.active{background:var(--brand);border-color:var(--brand);color:var(--onbrand);font-weight:700}

.tips-box{margin:22px 0 6px;background:var(--soft);border:1px solid var(--line);border-inline-start:5px solid var(--brand);border-radius:16px;padding:16px 18px}
.tips-box h2{margin:0 0 8px;font-size:20px}
.tips-box ul{margin:0;padding-inline-start:20px}
.tips-box li{margin:4px 0}

section h2.cat{font-size:22px;margin:30px 0 2px}
section h2.cat em{font-style:normal;color:var(--brand);font-size:15px}
section p.cat-desc{margin:0 0 14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.card.done{border-color:var(--ok);border-top-color:var(--ok)}
.body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.head{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:54px;height:54px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{width:38px;height:38px}
.logo b{font-size:22px;color:var(--brand)}
.head h3{margin:0;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.head small{color:var(--muted);direction:ltr;display:block;unicode-bidi:isolate}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--brand-d);font-weight:700}
.badge.lvl{background:transparent;border:1px solid var(--line);color:var(--muted)}
.badge.new{background:var(--brand);color:var(--onbrand)}
.card ul{margin:0;padding-inline-start:18px;font-size:14.5px}
.card li{margin:2px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{flex:1 1 120px;text-align:center;text-decoration:none;padding:10px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid var(--brand)}
.btn.primary{background:var(--brand);color:var(--onbrand)}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{color:var(--brand);background:transparent;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;min-height:32px}
.check input{width:20px;height:20px;accent-color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:40px 0;display:none}

footer{margin-top:40px;background:var(--bg2);border-top:3px solid var(--brand);padding:22px 0;text-align:center;color:var(--muted);font-size:14px}
footer a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--brand);font-weight:800;font-size:17px;margin-top:6px}
footer img{width:34px;height:34px;object-fit:contain}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
.modal.open{display:flex}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow-y:auto;border-radius:18px;border-top:5px solid var(--brand);padding:18px 18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:19px;flex:1;line-height:1.35}
.sheet-head small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:22px;line-height:1;cursor:pointer;flex:none}
.steps{list-style:none;margin:6px 0 14px;padding:0;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding-inline-start:44px;margin:0 0 12px;min-height:32px}
.steps li::before{content:counter(st);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-weight:800;font-size:15px}
.extra{margin:0 0 14px}
.extra h4{margin:4px 0 8px;font-size:16px;color:var(--brand)}
.extra dl{margin:0;display:grid;gap:8px}
.extra dt{font-weight:800;font-size:14px}
.extra dd{margin:0 0 4px;color:var(--muted);font-size:14px}
.extra ul{margin:0;padding-inline-start:20px;font-size:14px}
.extra ul li{margin-bottom:6px}
.sheet .note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--text);margin-bottom:14px}
@media (max-width:520px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:88dvh}}

/* ===== لوحة الخدمات ===== */
.svc-btn{background:var(--brand);border-color:var(--brand);color:var(--onbrand);position:relative}
.svc-btn:hover{background:var(--brand-d);color:var(--onbrand)}
.svc-btn .n:not(:empty){background:var(--onbrand);color:var(--brand);border-radius:99px;padding:0 7px;font-size:12px;line-height:20px}
.svc-sheet{max-width:1040px;padding-top:0}
.svc-sheet .sheet-head{position:sticky;top:0;z-index:2;background:var(--card);padding:14px 0 10px;margin:0}
.rules{background:var(--soft);border:1px solid var(--line);border-inline-start:5px solid var(--brand);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.rules summary{font-weight:800;cursor:pointer;font-size:16px}
.rules ol{margin:8px 0;padding-inline-start:22px}
.rules ol li{margin:3px 0}
.rules p{margin:6px 0 10px;font-size:14px;color:var(--muted)}
.svc-plat{display:flex;gap:8px;flex-wrap:wrap}
.svc-plat .btn{flex:0 1 auto;padding:7px 14px}
.svc-name{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:10px}
.svc-name input{margin-top:4px}
.svc-tools{position:sticky;top:64px;z-index:1;background:var(--card);padding:6px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.svc-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.svc-bar #svcCount{flex:1 1 160px;font-weight:700;color:var(--muted);font-size:14px}
.svc-bar .btn{flex:0 1 auto;padding:8px 14px;cursor:pointer;font:inherit;font-weight:700;font-size:14px}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px;margin-top:14px}
.svc-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.svc-card.sel{border-color:var(--ok);border-top-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--card))}
.svc-card h4{margin:0;font-size:16.5px;line-height:1.45;text-align:start}
.svc-card p{margin:0;font-size:14px;color:var(--muted)}
.svc-card details{font-size:14px;background:var(--bg2);border-radius:10px;padding:6px 10px}
.svc-card summary{cursor:pointer;font-weight:700;color:var(--brand)}
.svc-card details ul{margin:4px 0 6px;padding-inline-start:18px}
.svc-card .btn{cursor:pointer;font:inherit;font-weight:700;font-size:14px}
#modal{z-index:60}
.svc-rw{align-self:flex-start;border:1px dashed var(--brand);background:transparent;color:var(--brand);border-radius:99px;padding:3px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.svc-rw span{opacity:.7;font-weight:600}
.svc-guide-btn{margin-top:8px;width:100%;cursor:pointer;font:inherit;font-weight:800;font-size:15px}
.svc-prev{width:100%;height:auto;border-radius:12px;display:block;border:1px solid var(--line)}
.svc-sheet .svc-card .actions .btn{flex:1 1 80px;padding:9px 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.svc-sheet{max-height:94dvh}.svc-tools{top:60px}}
</style>
</head>

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const KEY = "fy-platforms-done";
let done = {};
try { done = JSON.parse(store.get(KEY) || "{}") || {}; } catch(e){ done = {}; }
let lang = store.get("fy-lang") === "en" ? "en" : "ar";
let active = "all";

function isDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
}
const savedTheme = store.get("fy-theme");
document.documentElement.setAttribute("data-theme", savedTheme || "light");

function L(){ return UI[lang]; }
function cat(k){ return lang==="en" ? CATS_EN[k] : CATS[k]; }
function siteName(s){ return lang==="en" ? (EN[s.d]?.n || s.n) : s.n; }
function siteTips(s){ return lang==="en" ? (EN[s.d]?.t || s.t) : s.t; }
function esc(x){ return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function updateThemeBtn(){
  document.getElementById("themeBtn").textContent = isDark() ? "☀️ " + L().light : "🌙 " + L().dark;
}
document.getElementById("themeBtn").onclick = ()=>{
  const next = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store.set("fy-theme", next); updateThemeBtn();
};
document.getElementById("langBtn").onclick = ()=>{
  lang = lang==="ar" ? "en" : "ar"; store.set("fy-lang", lang); applyLang();
};

function buildTabs(){
  const tabs = document.getElementById("tabs"); tabs.innerHTML = "";
  [["all", L().all], ...Object.keys(CATS).map(k=>[k, cat(k).name])].forEach(([k,label])=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (k===active ? " active" : "");
    b.textContent = label;
    b.onclick = ()=>{ active=k; buildTabs(); render(); };
    tabs.appendChild(b);
  });
}

function card(s){
  const id = s.d, u = L();
  const el = document.createElement("article");
  el.className = "card" + (done[id] ? " done" : "");
  const name = siteName(s);
  const logo = `https://www.google.com/s2/favicons?domain=${s.d}&sz=128`;
  const guide = `<button class="btn ghost" type="button" data-guide>📘 ${u.guide}</button>`;
  el.innerHTML = `
    <div class="body">
      <div class="head">
        <div class="logo"><img src="${logo}" alt="" loading="lazy"></div>
        <div style="min-width:0"><h3>${esc(name)}</h3><small>${s.d}</small></div>
      </div>
      <div class="badges"><span class="badge">${esc(cat(s.c).name)}</span><span class="badge lvl">${u.level}: ${u.lv[s.lvl]}</span>${s.nw?`<span class="badge new">${u.neu}</span>`:""}</div>
      <ul>${siteTips(s).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="actions">
        <a class="btn primary" href="${s.u}" target="_blank" rel="noopener">🌐 ${u.site}</a>
        ${guide}
        ${WORK[s.d] ? `<button class="btn ghost" type="button" data-work>🛠️ ${u.work}</button>` : ""}
      </div>
      <label class="check"><input type="checkbox" ${done[id]?"checked":""}> ${u.done}</label>
    </div>`;
  el.querySelector(".logo img").onerror = function(){ this.parentNode.innerHTML = `<b>${esc(name[0])}</b>`; };
  el.querySelector("[data-guide]").onclick = ()=>openGuide(s);
  if (WORK[s.d]) el.querySelector("[data-work]").onclick = ()=>openWork(s);
  el.querySelector("input").onchange = e=>{
    if (e.target.checked) done[id]=true; else delete done[id];
    el.classList.toggle("done", e.target.checked);
    store.set(KEY, JSON.stringify(done)); updateBar();
  };
  return el;
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";
  let shown = 0;
  Object.keys(CATS).forEach(k=>{
    if (active!=="all" && active!==k) return;
    const items = SITES.filter(s=>s.c===k && (!q || s.n.toLowerCase().includes(q) || (EN[s.d]?.n||"").toLowerCase().includes(q) || s.d.includes(q)));
    if (!items.length) return;
    shown += items.length;
    const sec = document.createElement("section");
    sec.innerHTML = `<h2 class="cat">${esc(cat(k).name)} <em>(${items.length})</em></h2><p class="cat-desc">${esc(cat(k).desc)}</p>`;
    const grid = document.createElement("div"); grid.className = "grid";
    items.forEach(s=>grid.appendChild(card(s)));
    sec.appendChild(grid); list.appendChild(sec);
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
}

function updateBar(){
  const n = SITES.filter(s=>done[s.d]).length;
  document.getElementById("bar").style.width = (n/SITES.length*100)+"%";
  document.getElementById("barLabel").textContent = L().progress(n, SITES.length);
}

function applyLang(){
  const u = L(), h = document.documentElement;
  h.lang = lang; h.dir = lang==="ar" ? "rtl" : "ltr";
  document.title = lang==="ar" ? "منصات العمل الحر | Freelance Yard" : "Freelance Platforms | Freelance Yard";

  document.getElementById("byLbl").textContent = u.by;
  document.getElementById("footLbl").textContent = u.foot;
  document.getElementById("q").placeholder = u.search;
  document.getElementById("empty").textContent = u.empty;
  document.getElementById("tipsTitle").textContent = u.tipsTitle;
  document.getElementById("tips").innerHTML = u.tips.map(([b,t])=>`<li><b>${esc(b)}</b> ${esc(t)}</li>`).join("");
  document.getElementById("langBtn").textContent = "🌐 " + u.lang;
  updateThemeBtn(); buildTabs(); render(); updateBar();
  svcLabels(); if (svcModal.classList.contains("open")) { svcTabs(); svcRender(); }
  if (openSite) (openMode==="work" ? openWork : openGuide)(openSite);
}

    steps = [u.step1(name, isApp), ...steps, u.stepLast];
  }
  document.getElementById("mTitle").innerHTML = `<small>${u.guideTitle}</small>${esc(name)}`;
  const lg = document.getElementById("mLogo");
  lg.innerHTML = `<img src="https://www.google.com/s2/favicons?domain=${s.d}&sz=128" alt="">`;
  lg.querySelector("img").onerror = function(){ lg.innerHTML = `<b>${esc(name[0])}</b>`; };
  document.getElementById("mSteps").innerHTML = steps.map(x=>`<li>${esc(x)}</li>`).join("");
  document.getElementById("mNote").textContent = u.note;
  const gl = lang==="en" ? (EN[s.d]?.gl || s.gl) : s.gl;
  document.getElementById("mActions").innerHTML =
    `<a class="btn primary" href="${s.u}" target="_blank" rel="noopener">🌐 ${u.site}</a>` +
    (s.g ? `<a class="btn ghost" href="${s.g}" target="_blank" rel="noopener">📄 ${esc(gl)}</a>` : "");
  modal.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("mClose").focus();
}
function closeGuide(){
  modal.classList.remove("open"); openSite = null;
  if (!document.getElementById("svcModal").classList.contains("open")) document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}
document.getElementById("mClose").onclick = closeGuide;
modal.addEventListener("click", e=>{ if (e.target === modal) closeGuide(); });
document.addEventListener("keydown", e=>{ if (e.key === "Escape" && modal.classList.contains("open")) closeGuide(); });

document.getElementById("q").addEventListener("input", render);
if (window.matchMedia) { try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeBtn); } catch(e){} }

function svcToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(svcToast.h); svcToast.h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function svcCopy(text){
  const fallback = ()=>{
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly","");
    ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch(e){}
    ta.remove(); svcToast(SU().copied);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(()=>svcToast(SU().copied), fallback);
  else fallback();
}

function svcFiltered(){
  const q = document.getElementById("svcQ").value.trim().toLowerCase();
  return SERVICES.map((s,i)=>i).filter(i=>{
    const s = SERVICES[i];
    if (svcCat!=="all" && s.c!==svcCat) return false;
    return !q || (svcTitles(i).join(" ")+" "+s.d+" "+s.k).toLowerCase().includes(q) || String(i+1)===q;
  });
}
function svcCount(shown){

}

// ===== صياغة تانية للعنوان =====
const SVC_VAR_KEY = "fy-svc-var", SVC_THEME_KEY = "fy-svc-theme";
let svcVar = {}, svcTheme = {};
try { svcVar = JSON.parse(store.get(SVC_VAR_KEY) || "{}") || {}; } catch(e){}
try { svcTheme = JSON.parse(store.get(SVC_THEME_KEY) || "{}") || {}; } catch(e){}
// أول مرة: كل طالب بياخد عنوان ولون عشوائي لكل خدمة، فالطلبة مش بيبدأوا كلهم بنفس العنوان
SERVICES.forEach((s,i)=>{

store.set(SVC_VAR_KEY, JSON.stringify(svcVar)); store.set(SVC_THEME_KEY, JSON.stringify(svcTheme));
function SVC_THEMES_N(){ return 6; }
function svcTitles(i){ return [SERVICES[i].t, ...(SVC_ALT[i]||[])]; }
function svcTitle(i){ const a = svcTitles(i); return a[(svcVar[i]||0) % a.length]; }
function svcNextTitle(i){

// ===== صورة الخدمة (Canvas) =====
const SVC_THEMES = [
  ["#f26b0f","#ffb347"], ["#1e3a8a","#3b82f6"], ["#065f46","#10b981"],
  ["#5b21b6","#a855f7"], ["#9f1239","#fb7185"], ["#0f172a","#0e7490"]
];
const SVC_ICON = {write:"✍️", design:"🎨", video:"🎬", dev:"💻", data:"📊", ai:"🤖", mkt:"📣", biz:"🗂️"};
function svcWrap(ctx, text, maxW){
  const words = text.split(/\s+/), lines = []; let line = "";
  words.forEach(w=>{
    const t = line ? line + " " + w : w;
    if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t;
  });
  if (line) lines.push(line);
  return lines;
}
function svcRound(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
async function svcDraw(i){
  const s = SERVICES[i], W = 1600, H = 940, P = 90;
  const [c1, c2] = SVC_THEMES[(svcTheme[i]||0) % SVC_THEMES.length];
  try { await document.fonts.load('800 80px Cairo', 'خدمة'); await document.fonts.load('600 40px Cairo', 'خدمة'); } catch(e){}
  const F = '"Cairo", "Segoe UI", Tahoma, Arial, sans-serif';
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  // خلفية
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.08)";
  ctx.beginPath(); ctx.arc(140, 160, 260, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(W-60, H+40, 330, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(300, H-80, 90, 0, Math.PI*2); ctx.fill();
  // أيقونة القسم
  ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.beginPath(); ctx.arc(250, 470, 150, 0, Math.PI*2); ctx.fill();
  ctx.font = `150px ${F}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "ltr";
  ctx.fillText(SVC_ICON[s.c] || "⭐", 250, 480);
  ctx.direction = "rtl"; ctx.textAlign = "right"; ctx.textBaseline = "alphabetic";
  const X = W - P, maxW = W - P - 470;
  // اسم القسم
  ctx.font = `700 34px ${F}`;
  const cat = SVC_CATS[s.c].ar.replace(/^\S+\s/, "");
  const cw = ctx.measureText(cat).width + 56;
  ctx.fillStyle = "rgba(255,255,255,.22)"; svcRound(ctx, X - cw, P, cw, 64, 32); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.fillText(cat, X - 28, P + 44);
  // العنوان (بيصغر لحد ما يدخل في 3 سطور)
  let size = 86, lines;
  do { ctx.font = `800 ${size}px ${F}`; lines = svcWrap(ctx, svcTitle(i), maxW); size -= 4; } while ((lines.length > 3 || (lines.length + 1) * (size + 4) * 1.55 > 478) && size > 46);
  const lh = size * 1.55; let y = P + 64 + 40 + lh;
  ctx.fillStyle = "#fff"; ctx.shadowColor = "rgba(0,0,0,.18)"; ctx.shadowBlur = 12;
  lines.slice(0, 4).forEach(l=>{ ctx.fillText(l, X, y); y += lh; });
  ctx.shadowBlur = 0;
  // هتستلم إيه
  y += 10; ctx.font = `600 36px ${F}`;
  s.g.forEach(t=>{
    if (y > H - 130) return;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(X - 20, y - 12, 20, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = c1; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(X - 29, y - 12); ctx.lineTo(X - 22, y - 4); ctx.lineTo(X - 10, y - 20); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.95)";
    const one = svcWrap(ctx, t, maxW - 60)[0];
    ctx.fillText(one, X - 56, y); y += 64;
  });
  // الشريط السفلي: التسليم + اسم الطالب (من غير سعر أو وسيلة تواصل)
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(0, H - 96, W, 96);
  ctx.fillStyle = "#fff"; ctx.font = `700 34px ${F}`;
  ctx.fillText("⏱ التسليم خلال " + (s.days===2 ? "يومين" : arDays(s.days)), X, H - 36);
  const name = (document.getElementById("svcName").value || "").trim();
  if (name){ ctx.textAlign = "left"; ctx.fillText("تنفيذ: " + name, P, H - 36); }
  return cv;
}
function svcShowModal(){
  modal.classList.add("open"); document.body.style.overflow = "hidden";
  document.getElementById("mClose").focus();
}
async function openSvcImage(i){
  openSite = null; lastFocus = document.activeElement;
  const u = SVC_UI2[lang];
  document.getElementById("mLogo").innerHTML = "<b>🖼️</b>";
  document.getElementById("mTitle").innerHTML = `<small>${esc(u.imgSub(i+1))}</small>${esc(svcTitle(i))}`;
  document.getElementById("mSteps").innerHTML = "";
  const cv = await svcDraw(i);
  const ex = document.getElementById("mExtra"); ex.innerHTML = "";
  const img = new Image(); img.src = cv.toDataURL("image/png"); img.alt = svcTitle(i); img.className = "svc-prev";
  ex.appendChild(img);
  document.getElementById("mNote").textContent = u.imgNote;
  const act = document.getElementById("mActions"); act.innerHTML = "";
  const mk = (cls, label, fn)=>{ const b = document.createElement("button"); b.type = "button"; b.className = "btn " + cls; b.textContent = label; b.onclick = fn; act.appendChild(b); return b; };
  mk("primary", u.dlPng, ()=>{
    cv.toBlob(b=>{
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `صورة-خدمة-${i+1}.png`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      svcToast(SU().saved);
    }, "image/png");
  });
  mk("ghost", u.color, ()=>{ svcTheme[i] = ((svcTheme[i]||0)+1) % SVC_THEMES.length; store.set(SVC_THEME_KEY, JSON.stringify(svcTheme)); openSvcImage(i); });
  mk("ghost", u.reword, ()=>{ svcNextTitle(i); svcRender(); openSvcImage(i); });
  if (!modal.classList.contains("open")) svcShowModal();
}
